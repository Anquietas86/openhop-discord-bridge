[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhop-discord-bridge"
version = "0.8.0"
description = "Two-way MeshCore <-> Discord channel bridge as an openHop Repeater plugin"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Anquietas86" }]
keywords = ["openhop", "meshcore", "repeater", "discord", "bridge", "plugin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Topic :: Communications",
  "Topic :: System :: Networking",
]
dependencies = [
  "discord.py>=2.4,<3",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["build", "pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/Anquietas86/openhop-discord-bridge"
Issues = "https://github.com/Anquietas86/openhop-discord-bridge/issues"

[project.scripts]
openhop-discord-bridge = "openhop_discord_bridge.server:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["openhop_discord_bridge"]

[tool.setuptools.data-files]
"share/openhop/plugins/discord.bridge" = ["openhop-plugin.json", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
